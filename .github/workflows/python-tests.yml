name: Python Unit Tests

# Trigger on pushes to main/feature branches and on PRs targeting main.
on:
  push:
    branches:
      - main
      - Mahmoud-phase1-first-trials
      - mahmoud-unit-testing-for-mutation
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Pull your code onto the CI server
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Install Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 3: Install your project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        PYTHONPATH: .
      run: |
        python -m pytest src/unit_tests/
