name: Python Unit Tests

# Trigger the pipeline on pushes or PRs to these branches
on:
  push:
    branches: [ "main", "Mahmoud-phase1-first-trials" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Pull your code onto the CI server
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Install Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Change this to match your local environment

    # Step 3: Install your project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # If you use pytest instead of the standard unittest library, install it here:
        pip install pytest 

    # Step 4: Execute the tests
    - name: Run tests
      run: |
        # python -m unittest discover -s src/unit_tests/
        # Or if you use pytest: 
        pytest src/unit_tests/
